version: '3.8'

services:
  # 1. Database (Persistence Layer)
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: series_db
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d series_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Kafka (Messaging Backbone)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.0.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 3. Python Core Logic (Kafka Bridge)
  python_matcher:
    build:
      context: ./python_matcher
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_INTENT: series_event_intents
      KAFKA_TOPIC_NOTIFY: series_frontend_notify
      SERIES_API_KEY: YOUR_HACKATHON_API_KEY
      DB_HOST: postgres
      DB_NAME: series_db
      DB_USER: user
      DB_PASSWORD: password
    restart: on-failure

  # 4. Node.js Frontend (Presentation/Input Layer)
  nodejs_frontend:
    build:
      context: ./nodejs_frontend
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Hot reload - mount public directory so changes reflect immediately
      - ./nodejs_frontend/public:/app/public
      - ./nodejs_frontend/server.js:/app/server.js
    environment:
      NODE_ENV: development
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC_INTENT: series_event_intents
      KAFKA_TOPIC_NOTIFY: series_frontend_notify
      PORT: 3000
    restart: on-failure


