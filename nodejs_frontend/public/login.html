<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --gray: #8E8E93;
            --border: rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 48px;
        }
        
        .login-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: var(--gray);
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        
        input:focus {
            outline: none;
            border-color: var(--black);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .error {
            color: #FF3B30;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">Series</div>
        <div class="login-card">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to continue</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="waqasarain0250@gmail.com" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                
                <div class="error" id="error"></div>
                
                <button type="submit">Sign in</button>
            </form>
            
            <p style="text-align: center; margin-top: 24px; color: var(--gray); font-size: 14px;">
                Don't have an account? <a href="/onboarding" style="color: var(--black); text-decoration: none; font-weight: 500;">Sign up</a>
            </p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            // Simple mock auth - for MVP
            if (email && password) {
                // Save user session
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_logged_in', 'true');
                
                // Redirect to home
                window.location.href = '/home';
            } else {
                errorDiv.textContent = 'Please enter email and password';
                errorDiv.classList.add('show');
            }
        });
        
        // Auto-fill demo credentials
        document.getElementById('email').value = 'waqasarain0250@gmail.com';
    </script>
</body>
</html>
