# Render Blueprint for Series Event Layer
# This file allows Render to automatically provision all services

services:
  # Main Web Service (Frontend)
  - type: web
    name: series-event-layer-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: KAFKA_BROKER
        value: kafka:9092
      - key: KAFKA_TOPIC_INTENT
        value: series_event_intents
      - key: KAFKA_TOPIC_NOTIFY
        value: series_frontend_notify
      - key: DATABASE_URL
        fromDatabase:
          name: series-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: series-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: series-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: series-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: series-db
          property: password

  # PostgreSQL Database
  - type: pg
    name: series-db
    plan: free
    databaseName: series_db
    user: user

# Note: Kafka and Zookeeper services would need to be added as
# separate Docker services in Render, or use Redis/alternatives

